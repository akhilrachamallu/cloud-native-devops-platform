services:

  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: task_platform
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d task_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: