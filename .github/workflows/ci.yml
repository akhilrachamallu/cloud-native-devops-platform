name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  # ============================================================
  # Backend Tests
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Python
      # ----------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ----------------------------------------------------------
      # Upgrade packaging tools
      # ----------------------------------------------------------
      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade \
            "pip>=26.0" \
            "setuptools>=78.1.1" \
            "wheel>=0.46.2"

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      # ----------------------------------------------------------
      # Run tests
      # ----------------------------------------------------------
      - name: Run backend tests
        run: |
          python -m pytest -v


  # ============================================================
  # Verify Backend Package Versions
  # ============================================================
  verify-packages:
    name: Verify Backend Packages
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade \
            "pip>=26.0" \
            "setuptools>=78.1.1" \
            "wheel>=0.46.2"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      # ----------------------------------------------------------
      # Display package information
      # ----------------------------------------------------------
      - name: Show backend package information
        run: |
          python -m pip show msgpack
          python -m pip show setuptools
          python -m pip show wheel
          python -m pip show jaraco.context

      # ----------------------------------------------------------
      # Verify package versions
      # ----------------------------------------------------------
      - name: Verify backend package versions
        run: |
          python -c "import msgpack; print('msgpack:', msgpack.__version__)"
          python -c "import setuptools; print('setuptools:', setuptools.__version__)"
          python -c "import wheel; print('wheel:', wheel.__version__)"

          python -c "from importlib.metadata import version; print('jaraco.context:', version('jaraco.context'))"


  # ============================================================
  # Build Backend Docker Image
  # ============================================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - verify-packages

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t cloud-native-devops-platform/backend:ci \
            ./backend

      - name: Show backend image
        run: |
          docker images cloud-native-devops-platform/backend


  # ============================================================
  # Build Frontend Docker Image
  # ============================================================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    needs:
      - backend-tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            -t cloud-native-devops-platform/frontend:ci \
            ./frontend

      - name: Show frontend image
        run: |
          docker images cloud-native-devops-platform/frontend


  # ============================================================
  # Trivy Backend Image Scan
  # ============================================================
  trivy-backend:
    name: Scan Backend Image with Trivy
    runs-on: ubuntu-latest

    needs:
      - build-backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t cloud-native-devops-platform/backend:ci \
            ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cloud-native-devops-platform/backend:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"


  # ============================================================
  # Trivy Frontend Image Scan
  # ============================================================
  trivy-frontend:
    name: Scan Frontend Image with Trivy
    runs-on: ubuntu-latest

    needs:
      - build-frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -t cloud-native-devops-platform/frontend:ci \
            ./frontend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cloud-native-devops-platform/frontend:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"