name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:

  # =====================================================
  # Backend Tests
  # =====================================================

  backend-test:
    name: Backend Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v


  # =====================================================
  # Frontend Build
  # =====================================================

  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build


  # =====================================================
  # Docker Build + Security Scan
  # =====================================================

  docker-build:
    name: Docker Build & Security Scan

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    permissions:
      contents: read

    steps:

      # -------------------------------------------------
      # Checkout repository
      # -------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # Docker Buildx
      # -------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -------------------------------------------------
      # Build Backend Docker Image
      # -------------------------------------------------

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
        context: ./backend
        push: false
        load: true
        tags: cloud-native-devops-platform/backend:ci

      - name: Verify backend package versions
        run: |
          docker run --rm cloud-native-devops-platform/backend:ci \
            python -c "import msgpack, setuptools, wheel, jwt; print('msgpack:', msgpack.__version__); print('setuptools:', setuptools.__version__); print('wheel:', wheel.__version__); print('PyJWT:', jwt.__version__)"

      - name: Verify vulnerable packages are absent
        run: |
        docker run --rm cloud-native-devops-platform/backend:ci \
        sh -c "python -m pip show ecdsa || true"

      - name: Show backend package information
        run: |
          docker run --rm cloud-native-devops-platform/backend:ci \
          python -m pip show msgpack setuptools wheel PyJWT

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: cloud-native-devops-platform/frontend:ci

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-native-devops-platform/backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          vuln-type: os,library
          ignore-unfixed: true

      # -------------------------------------------------
      # Scan Frontend Image with Trivy
      # -------------------------------------------------

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-native-devops-platform/frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH