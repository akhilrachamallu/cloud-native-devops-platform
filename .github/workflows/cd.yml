name: CD - Docker Hub + Kubernetes

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # Job 1: Build and Push Docker Images
  # ==========================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------
      # Build Backend
      # ------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-backend:latest \
            ./backend

      # ------------------------------------------
      # Build Frontend
      # ------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-frontend:latest \
            ./frontend

      # ------------------------------------------
      # Push Backend
      # ------------------------------------------

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-backend:latest

      # ------------------------------------------
      # Push Frontend
      # ------------------------------------------

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-frontend:latest


  # ==========================================
  # Job 2: Deploy to Local Minikube
  # ==========================================

  deploy:
    name: Deploy to Minikube
    needs: build-and-push
    runs-on: self-hosted

    steps:

      # ------------------------------------------
      # Checkout Repository
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Verify Docker
      # ------------------------------------------

      - name: Verify Docker
        shell: powershell
        run: |
          docker version

      # ------------------------------------------
      # Verify Kubernetes
      # ------------------------------------------

      - name: Verify Kubernetes
        shell: powershell
        run: |
          kubectl version --client
          kubectl get nodes

      # ------------------------------------------
      # Verify Minikube
      # ------------------------------------------

      - name: Verify Minikube
        shell: powershell
        run: |
          minikube status

      # ------------------------------------------
      # Apply PostgreSQL
      # ------------------------------------------

      - name: Apply PostgreSQL
        shell: powershell
        run: |
          kubectl apply -f k8s/postgres.yaml

      # ------------------------------------------
      # Apply Backend
      # ------------------------------------------

      - name: Apply Backend
        shell: powershell
        run: |
          kubectl apply -f k8s/backend.yaml

      # ------------------------------------------
      # Apply Frontend
      # ------------------------------------------

      - name: Apply Frontend
        shell: powershell
        run: |
          kubectl apply -f k8s/frontend.yaml

      # ==========================================
      # Deploy Exact Git SHA Images
      # ==========================================

      - name: Deploy Backend SHA image
        shell: powershell
        run: |
          kubectl set image deployment/backend `
            backend=${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-backend:${{ github.sha }}

      - name: Deploy Frontend SHA image
        shell: powershell
        run: |
          kubectl set image deployment/frontend `
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-devops-platform-frontend:${{ github.sha }}

      # ==========================================
      # Rolling Deployment Verification
      # ==========================================

      - name: Wait for Backend Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/backend --timeout=180s

      - name: Wait for Frontend Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/frontend --timeout=180s

      # ==========================================
      # Verify Exact Images
      # ==========================================

      - name: Verify Backend Image
        shell: powershell
        run: |
          Write-Host "Backend deployed image:"
          kubectl get deployment backend `
            -o jsonpath="{.spec.template.spec.containers[0].image}"
          Write-Host ""

      - name: Verify Frontend Image
        shell: powershell
        run: |
          Write-Host "Frontend deployed image:"
          kubectl get deployment frontend `
            -o jsonpath="{.spec.template.spec.containers[0].image}"
          Write-Host ""

      # ==========================================
      # Verify Kubernetes Resources
      # ==========================================

      - name: Verify Pods
        shell: powershell
        run: |
          kubectl get pods -o wide

      - name: Verify Deployments
        shell: powershell
        run: |
          kubectl get deployments

      - name: Verify Services
        shell: powershell
        run: |
          kubectl get services

      # ==========================================
      # Backend Health Check
      # ==========================================

      - name: Backend Health Check
        shell: powershell
        run: |

          $portForward = Start-Job {
            kubectl port-forward svc/backend 8001:8000
          }

          Start-Sleep -Seconds 5

          try {

            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8001/api/health" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "Backend response:"
            Write-Host $response.Content

            if ($response.StatusCode -ne 200) {
              throw "Backend health check failed with HTTP status $($response.StatusCode)"
            }

            if ($response.Content -notmatch "healthy") {
              throw "Backend did not return healthy status"
            }

            Write-Host "Backend health check passed."

          }
          finally {

            Stop-Job $portForward -ErrorAction SilentlyContinue

            Remove-Job $portForward -Force -ErrorAction SilentlyContinue

          }